# SonarQube Cloud configuration
#
# Analysis runs from CI (.github/workflows/ci.yml) rather than SonarCloud's
# Automatic Analysis, because Automatic Analysis cannot import a coverage
# report. The coverage file referenced below is produced by
# Scripts/coverage_report.py from the same xcresult the test job creates, so
# the number Sonar shows is the number the CI gate enforced.

sonar.projectKey=no-c-123_GirokIQ-iOS
sonar.organization=no-c-123
sonar.projectName=GirokIQ-iOS

# Swift app sources plus the Deno edge functions, which are the only
# internet-facing code in the project and so are worth analysing.
sonar.sources=GirokIQ-ios,supabase/functions
sonar.tests=GirokIQ-iosTests
sonar.sourceEncoding=UTF-8

# Wait for SonarQube to finish processing and report the quality gate.
# Without this the scanner exits as soon as the report is uploaded, so a
# server-side rejection (a wrong project key, for one) leaves the job green
# while nothing reaches the project.
sonar.qualitygate.wait=true

# Generic coverage format, written by Scripts/coverage_report.py --sonar-out.
sonar.coverageReportPaths=coverage-sonar.xml

# Binary and generated content carries no analysable source.
sonar.exclusions=**/Assets.xcassets/**,**/*.storekit,**/Fonts/**,**/*.xcassets/**

# SwiftUI view declarations are analysed for bugs and vulnerabilities like
# everything else, but they are left out of the COVERAGE calculation.
#
# Why: a SwiftUI `View` is a declarative description of a layout. Exercising it
# requires a UI test driving a simulator, not a unit test, and a unit test that
# merely instantiates one asserts nothing about whether it renders correctly.
# Counting ~12,800 lines of layout as "uncovered" made the coverage figure
# measure how much interface exists rather than how well the logic is tested,
# and the quality gate then failed on a number that no reasonable amount of
# unit testing could move.
#
# The pattern is deliberately narrow. It matches files whose name ends in
# View.swift or Views.swift plus the flashcards design kit -- all of them pure
# view declarations. It does NOT match view models (FlashcardsViewModel.swift
# ends in Model.swift), services, or any model type, so everything that holds
# testable logic is still counted and still has to be covered.
sonar.coverage.exclusions=**/*View.swift,**/*Views.swift,**/*DesignKit.swift
