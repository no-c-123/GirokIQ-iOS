# SonarQube Cloud configuration
#
# Analysis runs from CI (.github/workflows/ci.yml) rather than SonarCloud's
# Automatic Analysis, because Automatic Analysis cannot import a coverage
# report. The coverage file referenced below is produced by
# Scripts/coverage_report.py from the same xcresult the test job creates, so
# the number Sonar shows is the number the CI gate enforced.

sonar.projectKey=no-c-123_girokiq-ios
sonar.organization=no-c-123
sonar.projectName=GirokIQ-iOS

# Swift app sources plus the Deno edge functions, which are the only
# internet-facing code in the project and so are worth analysing.
sonar.sources=GirokIQ-ios,supabase/functions
sonar.tests=GirokIQ-iosTests
sonar.sourceEncoding=UTF-8

# Generic coverage format, written by Scripts/coverage_report.py --sonar-out.
sonar.coverageReportPaths=coverage-sonar.xml

# Binary and generated content carries no analysable source.
sonar.exclusions=**/Assets.xcassets/**,**/*.storekit,**/Fonts/**,**/*.xcassets/**
