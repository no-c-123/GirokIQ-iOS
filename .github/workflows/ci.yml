name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: GirokIQ-ios.xcodeproj
  SCHEME: GirokIQ-ios
  # Xcode needed for IPHONEOS_DEPLOYMENT_TARGET 26.2.
  MINIMUM_XCODE: "26.2"

jobs:
  test:
    name: Unit tests and coverage
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          set -euo pipefail
          echo "Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app

          newest=""
          newest_version="0"
          for app in /Applications/Xcode*.app; do
            version=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}') || continue
            [ -z "$version" ] && continue
            if [ "$(printf '%s\n%s\n' "$version" "$newest_version" | sort -V | tail -1)" = "$version" ]; then
              newest="$app"
              newest_version="$version"
            fi
          done

          if [ -z "$newest" ]; then
            echo "::error::No Xcode installation found on the runner."
            exit 1
          fi

          if [ "$(printf '%s\n%s\n' "$newest_version" "$MINIMUM_XCODE" | sort -V | head -1)" != "$MINIMUM_XCODE" ]; then
            echo "::error::Xcode $newest_version is older than the required $MINIMUM_XCODE (the app targets iOS $MINIMUM_XCODE). Pin a runner image that ships a newer Xcode."
            exit 1
          fi

          echo "Selected Xcode $newest_version at $newest"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Choose an iPad simulator
        run: |
          set -euo pipefail
          device_id=$(python3 Scripts/pick_simulator.py)
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | { command -v xcbeautify >/dev/null 2>&1 && xcbeautify --renderer github-actions || cat; }
        shell: bash

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | { command -v xcbeautify >/dev/null 2>&1 && xcbeautify --renderer github-actions || cat; }
        shell: bash

      - name: Report coverage and enforce the gate
        if: always()
        run: |
          set -euo pipefail
          test -d TestResults.xcresult || { echo "::error::No test results produced."; exit 1; }
          python3 Scripts/coverage_report.py TestResults.xcresult \
            --markdown-out coverage-summary.md \
            --sonar-out coverage-sonar.xml
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            coverage-summary.md
            coverage-sonar.xml
          retention-days: 14

  sonar:
    name: SonarQube Cloud analysis
    needs: test
    # Main branch and pull requests only. The free plan analyses the main
    # branch and PRs; a long-lived feature branch is rejected with
    # "Organization is not allowed to access data from non main branches",
    # which is what failed the first attempt at this job.
    #
    # Still runs when the coverage gate fails, so a drop in quality stays
    # visible in Sonar rather than hidden behind a red build.
    if: >-
      always() && needs.test.result != 'cancelled' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Sonar uses history to attribute issues to the commit that
          # introduced them; a shallow clone makes every line look new.
          fetch-depth: 0

      - name: Download the coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results

      - name: Check the analysis prerequisites
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Without this guard the scanner reports a bare "error during parsing
          # of the generic coverage report", which says nothing about the real
          # cause: the test job failed before writing the file.
          if [ ! -s coverage-sonar.xml ]; then
            echo "::error::coverage-sonar.xml is missing or empty -- the test job did not produce a coverage report."
            exit 1
          fi

          python3 -c "import xml.etree.ElementTree as ET; r = ET.parse('coverage-sonar.xml').getroot(); print(f'Coverage report covers {len(r)} file(s).')"

      - name: Run the scanner
        # Does not block the build. The quality gate applies to "new code", and
        # on a first analysis that means the entire code base, so new_coverage
        # reports the whole-project figure rather than the coverage of what this
        # change actually touched. The gate result is still recorded in the logs
        # and in reports/calidad/sonarqube.md, and sonar.qualitygate.wait stays
        # on so a server-side rejection cannot pass silently.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy:
    name: Deploy to TestFlight
    needs: test
    # Only from main, and only when the tests passed. A build that fails its
    # tests must never reach a tester.
    if: |
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ARCHIVE_PATH: build/GirokIQ-ios.xcarchive
      EXPORT_PATH: build/export

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          set -euo pipefail
          newest=""
          newest_version="0"
          for app in /Applications/Xcode*.app; do
            version=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}') || continue
            [ -z "$version" ] && continue
            if [ "$(printf '%s\n%s\n' "$version" "$newest_version" | sort -V | tail -1)" = "$version" ]; then
              newest="$app"
              newest_version="$version"
            fi
          done
          if [ -z "$newest" ]; then
            echo "::error::No Xcode installation found on the runner."
            exit 1
          fi
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in KEY_ID KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is not set. See Docs/Despliegue.md."
              exit 1
            fi
          done

          # altool looks for the key by this exact name in one of a few fixed
          # directories; xcodebuild is given the path explicitly.
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "::error::The decoded key is not a PEM private key. Re-encode the .p8 with: base64 -i AuthKey_XXX.p8"
            exit 1
          fi
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive the app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # -allowProvisioningUpdates with the API key lets xcodebuild fetch or
          # create the signing assets itself, so no distribution certificate or
          # provisioning profile has to be stored as a secret.
          #
          # App Store Connect rejects a build number it has already seen, so the
          # workflow run number is used: it only ever increases.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | { command -v xcbeautify >/dev/null 2>&1 && xcbeautify --renderer github-actions || cat; }

      - name: Export a signed build
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # method must be app-store-connect for TestFlight. The checked-in
          # ExportOptions.plist from the manual archive uses release-testing,
          # which is the ad-hoc equivalent and cannot be uploaded.
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>965LN23U3C</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | { command -v xcbeautify >/dev/null 2>&1 && xcbeautify --renderer github-actions || cat; }

          ls -la "$EXPORT_PATH"

      - name: Validate the build before uploading
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find "$EXPORT_PATH" -name '*.ipa' -maxdepth 1 | head -1)
          [ -n "$ipa" ] || { echo "::error::No .ipa was produced."; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

          # Validation catches most rejections (entitlements, icons, Info.plist)
          # before a build number is consumed.
          xcrun altool --validate-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

          {
            echo "## Deployed to TestFlight"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Build number | ${{ github.run_number }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo
            echo "App Store Connect takes a few minutes to process the build."
            echo "Internal testers receive it without review; external testers"
            echo "need Beta App Review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-${{ github.run_number }}
          path: |
            build/export/*.ipa
            build/export/*.plist
          retention-days: 30
          if-no-files-found: warn
